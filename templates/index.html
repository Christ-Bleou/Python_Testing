<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GUDLFT Registration</title>
</head>

<body>
    <main>
        <h1>Welcome to the GUDLFT Registration Portal!</h1>
        <p>Please enter your secretary email to continue:</p>
        

        <form action="{{ url_for('welcomeSummary') }}" method="post">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required placeholder="your secretary email" />
            <button type="submit">Enter</button>
        </form>


        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul>
            {% for message in messages %}
            <li style="color: red;">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}
    </main>
</body>

</html>
